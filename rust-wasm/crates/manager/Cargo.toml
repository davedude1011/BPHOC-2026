[package]
name = "manager"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
shared = { path = "../shared" }
task_1 = { path = "../task_1" }
task_2 = { path = "../task_2" }
task_4 = { path = "../task_4" }
task_6 = { path = "../task_6" }
task_10 = { path = "../task_10" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
